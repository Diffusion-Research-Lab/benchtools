[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchtools"
version = "0.1.0"
description = "Configuration, reproducibility, and reporting tools for machine-learning benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = [
  "flake8>=7.0",
  "pytest>=8.2.1",
  "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/Diffusion-Research-Lab/benchtools"

[tool.setuptools]
packages = ["benchtools"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["benchtools/tests"]

[tool.coverage.run]
source = ["benchtools"]
omit = ["benchtools/tests/*"]

[tool.coverage.report]
omit = ["benchtools/tests/*"]
